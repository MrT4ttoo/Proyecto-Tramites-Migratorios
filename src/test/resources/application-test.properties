# ============================================================================
# Plataforma Interoperable de Trámites Migratorios (Test Profile)
# Configuración para Pruebas DevSecOps y QA
# ============================================================================

spring.datasource.url=jdbc:h2:mem:snm_tramites_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Trazabilidad de consultas y binding de parámetros (Evidencia DAST)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.pa.gob.migracion=DEBUG
