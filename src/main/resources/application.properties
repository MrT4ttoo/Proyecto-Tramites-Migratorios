# ============================================================================
# Plataforma Interoperable de Trámites Migratorios
# Configuración de Persistencia PostgreSQL + Spring Data JPA
# ============================================================================

# Credenciales: se leen de .env (copia .env.example) o de variables de entorno
spring.config.import=optional:file:.env[.properties]

# Servidor Web
server.port=8081
server.servlet.context-path=/

# Configuración del DataSource PostgreSQL (Docker Compose)
spring.datasource.url=jdbc:postgresql://localhost:5432/snm_tramites?currentSchema=snm,seg,cat,priv,ext,aud,met,public
spring.datasource.username=${POSTGRES_USER:admin_snm}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de Conexiones HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# Configuración Hibernate / JPA
# Se establece ddl-auto=none para respetar el esquema DDL oficial y probado de BD_Tramites.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=snm
spring.jpa.open-in-view=false

# Registro de consultas parametrizadas (Evidencia DevSecOps contra SQLi)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.pa.gob.migracion=DEBUG
