services:
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres_snm_tramites
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-snm_tramites}
      POSTGRES_USER: ${POSTGRES_USER:-admin_snm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env (copia .env.example)}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./BD_Tramites.sql:/docker-entrypoint-initdb.d/01-init.sql

volumes:
  postgres_data:
